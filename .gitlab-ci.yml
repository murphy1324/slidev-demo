# .gitlab-ci.yml

workflow:
  rules:
    # push 到 main 时触发
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'

    - when: never

stages:
  - deploy

deploy-pages:
  stage: deploy
  image: node:20

  # 类似 GitHub Actions 的 concurrency: group: pages
  resource_group: pages
  interruptible: true

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  script:
    - npm ci --cache .npm --prefer-offline
    - npx slidev build --base /

  pages:
    publish: dist

  artifacts:
    paths:
      - dist