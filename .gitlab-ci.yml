# .gitlab-ci.yml

workflow:
  rules:
    # 对应 GitHub Actions: push branches: [main]
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

    # 对应 GitHub Actions: workflow_dispatch
    # GitLab 页面手动 Run pipeline 时会走这个
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'

    - when: never

stages:
  - deploy

deploy-pages:
  stage: deploy
  image: node:20

  # 近似对应 GitHub concurrency: group: pages
  resource_group: pages
  interruptible: true

  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  script:
    - npm ci --cache .npm --prefer-offline
    - npx slidev build --base /slidev-demo/

  pages:
    publish: dist

  artifacts:
    paths:
      - dist

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'